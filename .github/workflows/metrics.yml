name: Generate Metrics

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Render github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # Classic PAT with `public_repo` + `read:user` scopes — see SETUP.md.
          # Falls back to the built-in GITHUB_TOKEN (some plugins may be limited).
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Rishi9322
          template: classic
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata

          # Base sections: repositories, stars, followers
          base: header, activity, community, repositories, metadata

          # Achievements
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          # Languages
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_languages_sections: most-used

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Coding habits (commit hours / days)
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 30

          # Recent activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14

          # People / followers
          plugin_people: yes
          plugin_people_types: followers
